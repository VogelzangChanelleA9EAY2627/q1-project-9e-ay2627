<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Form</title>
    <style type="text/css">
        body {
           backround-color: Lightpink;
           color: pink;
         }
    </style>

</head>
<body>
    <!-- HERO SECTION -->
    <div class="hero-image">
        <div class="hero-text">
            <h1>Blackstone Bistro | Pizza-On-Demand</h1>
        </div>
    </div>
    
    <p>
        Our 12" wood-fired pizzas are available for delivery. Build your own custom pizza and we will deliver it in an hour.
    </p>
    
        <form>
            <fieldset>
                <legend>Your Information</legend>
                <label for="full-name">Name:</label>
                <input type="text" name="full-name" placeholder="Enter your full name">
                <br>
                <!-- ADRESS -->
                <label for="full-adress">Adress:</label>
                <input type="text" name="full-adress" placeholder="Enter your adress">
                <br>
                
                <!-- MOBILE NUMBER -->
                <label for="mobile-number">Mobile number:</label>
                <input type="text" name="mobile-number" placeholder="Enter your mobile number">
                <br>

                <!-- CONTACT -->
                <label for="contact">Contact:</label>
                <input type="text" name="contact" placeholder="Enter your contact">
                <br>
               
                <!-- EMAIL -->
                 <label for="email">Email:</label>
                <input type="text" name="contact" placeholder="Enter your email">
                <br>

                
                <!-- MESSAGE -->
                 <label>Delivery Requests</label><br>
                 <textarea placeholder="Add delivery instructions"></textarea>

            </fieldset>

        </form>

            <h3>Design your dream pizza</h3>

            <fieldset>
                <legend>Pizza Specifications</legend>

                <!-- Crust -->
                <fieldset>
                    <legend>Crust <em>(Choose one)</em></legend>
                    <!-- Classic White -->
                     <input type="radio" name="crust">
                     <label>Classic White</label>
                     <br>
                     <!-- Multigrain -->
                      <input type="radio" name="crust">
                     <label>Multigrain</label>
                     <br>
                     <!-- Cheese-stuffed crust -->
                      <input type="radio" name="crust">
                     <label>Cheese-stuffed crust</label>
                    <br>
                    <!-- Gluten free -->
                     <input type="radio" name="crust">
                     <label>Gluten free</label>
                     <br>
                </fieldset>
                <br>

                <fieldset>
                    <legend>Topping <em>(Choose as many as you want)</em></legend>
                    <!-- Red sauce -->
                     <input type="checkbox" name="Topping">
                     <label>Red sauce</label>
                     <br>
                     <!-- White sauce -->
                      <input type="checkbox" name="Topping">
                     <label>White sauce</label>
                     <br>
                     <!-- Mozzarella cheese -->
                      <input type="checkbox" name="Topping">
                     <label>Mozzarella cheese</label>
                     <br>
                     <!-- Pepperoni -->
                      <input type="checkbox" name="Topping">
                     <label>Pepperoni</label>
                     <br>
                     <!-- Mushrooms -->
                      <input type="checkbox" name="Topping">
                     <label>Mushrooms</label>
                     <br>
                     <!-- Peppers -->
                      <input type="checkbox" name="Topping">
                     <label>Peppers</label>
                     <br>
                     <!-- Pineapple -->
                      <input type="checkbox" name="Topping">
                     <label>Pineapple</label>
                     <br>
                    
                </fieldset>
                <br>

                <fieldset>
                    <legend>Number: </legend>
                    <select>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                    </fieldset>
                        
                </fieldset>
                    
                <input type="submit" value="Bring me my pizza">
                <input type="reset" value="Let me order again">


            </fieldset>

    

    </body>
    </html>



             
</body>
</html>
